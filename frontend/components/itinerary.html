<div id="itinerary-tab" class="tab-panel">
    <div class="routing-panel" style="padding: 0;">
        <p style="font-size: 13px; color: var(--text-secondary); line-height: 1.4; margin-bottom: 12px;">
            Nhập số ngày, ngân sách và sở thích du lịch để AI tự động lên lịch trình chi tiết và vẽ
            tuyến đường tối ưu trên bản đồ.
        </p>
        <div class="form-group">
            <label>Số ngày du lịch:</label>
            <input type="number" id="itin-days" class="itin-input" min="1" max="7" value="3">
        </div>
        <div class="form-group">
            <label>Ngân sách dự kiến:</label>
            <select id="itin-budget" class="itin-select">
                <option value="Giá rẻ">Giá rẻ (Homestay, quán ăn bình dân)</option>
                <option value="Trung bình" selected>Trung bình (Khách sạn 3 sao, nhà hàng vừa)</option>
                <option value="Sang trọng">Sang trọng (Resort 5 sao, ẩm thực cao cấp)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Sở thích / Yêu cầu đặc biệt:</label>
            <textarea id="itin-prefs" class="itin-textarea"
                placeholder="Ví dụ: Thích đi biển, ăn hải sản, tham quan danh lam thắng cảnh lịch sử, hạn chế đi bộ xa..."></textarea>
        </div>

        <button id="generate-itin-btn" class="route-btn" onclick="generateItinerary()">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Tạo lịch trình thông minh với AI
        </button>

        <!-- Itinerary Results & Saved Panel -->
        <div id="itinerary-results" style="display: none; margin-top: 20px;">
            <div
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
                <h4 style="color: var(--accent-glow); font-size: 14px;"><i class="fa-solid fa-list-check"></i> Lịch
                    trình chi tiết</h4>
                <button id="save-itin-btn" onclick="saveCurrentItinerary()"
                    style="background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer;">
                    <i class="fa-solid fa-floppy-disk"></i> Lưu lịch trình
                </button>
            </div>
            <div id="itin-days-container"></div>
        </div>

        <!-- Saved Itineraries List -->
        <div style="margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 16px;">
            <h4 style="color: var(--text-primary); font-size: 13px; margin-bottom: 10px;">
                <i class="fa-solid fa-bookmark"></i> Lịch trình đã lưu của bạn
            </h4>
            <div id="saved-itins-list">
                <p style="font-size: 11px; color: var(--text-secondary);">Hãy đăng nhập để lưu và quản lý lịch trình
                    cá nhân.</p>
            </div>
        </div>
    </div>
</div>
