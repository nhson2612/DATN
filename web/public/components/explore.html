<div id="explore-tab" class="tab-panel">
    <div class="routing-panel" style="padding: 0;">

        <!-- Ô tìm điểm đến. Baymard: 99% người dùng tìm ô tìm kiếm ngay khi vào
             trang, nên nó nằm trên cùng chứ không phải nút nổi trên bản đồ. -->
        <div class="form-group">
            <label>Bạn muốn đi đâu?</label>
            <input type="text" id="explore-dest" class="itin-input"
                   placeholder="Đà Nẵng, Hà Nội, Lâm Đồng..."
                   onkeydown="if(event.key==='Enter') moDiemDen(this.value)">
        </div>

        <!-- View 1: danh sách điểm đến -->
        <div id="explore-home">
            <h4 style="font-size: 13px; margin: 4px 0 10px;">
                <i class="fa-solid fa-location-dot"></i> Điểm đến nổi bật
            </h4>
            <div id="dest-list"></div>
        </div>

        <!-- View 2: một điểm đến, địa điểm gom theo nhóm -->
        <div id="explore-dest-view" style="display: none;">
            <button class="route-btn" style="background: transparent; color: var(--text-secondary); border: 1px solid var(--border-color); margin-bottom: 12px;"
                    onclick="veTrangDiemDen()">
                <i class="fa-solid fa-arrow-left"></i> Tất cả điểm đến
            </button>
            <h3 id="dest-name" style="font-size: 16px; margin-bottom: 4px;"></h3>
            <p id="dest-meta" style="font-size: 12px; color: var(--text-secondary); margin-bottom: 12px;"></p>

            <div id="dest-groups"></div>
        </div>

        <!-- View 3: chi tiết một địa điểm -->
        <div id="explore-detail" style="display: none;">
            <button class="route-btn" style="background: transparent; color: var(--text-secondary); border: 1px solid var(--border-color); margin-bottom: 12px;"
                    onclick="quayLaiDiemDen()">
                <i class="fa-solid fa-arrow-left"></i> Quay lại
            </button>
            <div id="detail-body"></div>
        </div>

    </div>
</div>
