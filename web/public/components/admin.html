<div class="routing-panel" style="padding: 0;">
    <h4 style="color: #f87171; font-size: 13px; margin-bottom: 8px;">
        <i class="fa-solid fa-circle-nodes"></i> Thêm Địa Điểm Mới
    </h4>
    <p style="font-size: 11px; color: var(--text-secondary); margin-bottom: 10px; line-height: 1.4;">
        Chọn một điểm bất kỳ trên bản đồ ở chế độ Tab Quản trị để lấy tọa độ, sau đó điền thông tin bên dưới để tạo địa điểm mới.
    </p>
    <div class="form-group">
        <label>Tọa độ địa lý:</label>
        <div style="display: flex; gap: 8px;">
            <input type="text" id="admin-lon" class="itin-input" placeholder="Kinh độ (Lon)" readonly>
            <input type="text" id="admin-lat" class="itin-input" placeholder="Vĩ độ (Lat)" readonly>
        </div>
    </div>
    <div class="form-group">
        <label>Phân loại địa điểm:</label>
        <select id="admin-place-type" class="itin-select" onchange="toggleAdminFields()">
            <option value="poi">Địa điểm du lịch (POI)</option>
            <option value="accommodation">Cơ sở lưu trú (Khách sạn/Homestay)</option>
        </select>
    </div>
    <div class="form-group">
        <label>Tên địa điểm:</label>
        <input type="text" id="admin-name" class="itin-input" placeholder="Nhập tên địa điểm...">
    </div>

    <!-- POI Fields -->
    <div id="admin-poi-fields">
        <div class="form-group">
            <label>Tiện ích (Amenity):</label>
            <input type="text" id="admin-poi-amenity" class="itin-input" placeholder="restaurant, cafe, bar, fast_food...">
        </div>
        <div class="form-group">
            <label>Du lịch (Tourism):</label>
            <input type="text" id="admin-poi-tourism" class="itin-input" placeholder="attraction, viewpoint, museum, theme_park...">
        </div>
        <div class="form-group">
            <label>Mô tả chi tiết:</label>
            <textarea id="admin-poi-desc" class="itin-textarea" placeholder="Nhập mô tả địa danh..."></textarea>
        </div>
    </div>

    <!-- Accommodation Fields -->
    <div id="admin-acc-fields" style="display: none;">
        <div class="form-group">
            <label>Loại hình lưu trú (Tourism):</label>
            <input type="text" id="admin-acc-tourism" class="itin-input" placeholder="hotel, guest_house, hostel...">
        </div>
        <div class="form-group">
            <label>Hạng sao (0-5):</label>
            <input type="number" id="admin-acc-stars" class="itin-input" min="0" max="5" value="3">
        </div>
        <div class="form-group">
            <label>Mức giá:</label>
            <select id="admin-acc-price" class="itin-select">
                <option value="Rẻ">Rẻ</option>
                <option value="Trung bình" selected>Trung bình</option>
                <option value="Sang trọng">Sang trọng</option>
            </select>
        </div>
        <div class="form-group">
            <label>Địa chỉ:</label>
            <input type="text" id="admin-acc-address" class="itin-input" placeholder="Địa chỉ cơ sở...">
        </div>
    </div>

    <button id="add-place-btn" class="route-btn" onclick="saveNewPlace()" style="background: #ef4444;" disabled>
        <i class="fa-solid fa-circle-plus"></i> Lưu Địa Điểm Mới
    </button>

    <!-- Admin Places List Component -->
    <div style="margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 16px; display: flex; flex-direction: column; gap: 12px;">
        <h4 style="color: var(--accent-glow); font-size: 13px; display: flex; justify-content: space-between; align-items: center;">
            <span><i class="fa-solid fa-list-check"></i> Danh sách địa điểm hệ thống</span>
            <span id="admin-places-count" style="font-size: 11px; color: var(--text-secondary);">0 địa điểm</span>
        </h4>
        <input type="text" id="admin-search-place" class="itin-input" placeholder="Tìm kiếm nhanh theo tên địa điểm..." oninput="filterAdminPlacesList()">
        <div id="admin-places-list" style="max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
            <!-- Managed places will go here -->
        </div>
    </div>
</div>
