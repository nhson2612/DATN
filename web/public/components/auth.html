<div class="modal-container">
    <div class="modal-header">
        <h3 id="modal-title">Đăng nhập</h3>
        <button class="close-modal-btn" onclick="closeAuthModal()">&times;</button>
    </div>

    <!-- Login Form -->
    <div id="login-form-panel">
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="login-email" class="itin-input"
                placeholder="admin@gmail.com hoặc user@gmail.com">
        </div>
        <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" id="login-password" class="itin-input" placeholder="Mật khẩu của bạn...">
        </div>
        <button class="route-btn" onclick="handleLogin()" style="margin-top: 10px;">Đăng nhập</button>
        <p style="font-size: 12px; margin-top: 12px; text-align: center; color: var(--text-secondary);">
            Chưa có tài khoản? <a href="#" onclick="toggleAuthForm(false)"
                style="color: var(--accent-glow);">Đăng ký ngay</a>
        </p>
    </div>

    <!-- Register Form -->
    <div id="register-form-panel" style="display: none;">
        <div class="form-group">
            <label>Họ và tên:</label>
            <input type="text" id="reg-name" class="itin-input" placeholder="Họ và tên...">
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="reg-email" class="itin-input" placeholder="Email...">
        </div>
        <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" id="reg-password" class="itin-input" placeholder="Mật khẩu...">
        </div>
        <button class="route-btn" onclick="handleRegister()" style="margin-top: 10px; background: #818cf8;">Đăng
            ký</button>
        <p style="font-size: 12px; margin-top: 12px; text-align: center; color: var(--text-secondary);">
            Đã có tài khoản? <a href="#" onclick="toggleAuthForm(true)" style="color: var(--accent-glow);">Đăng
                nhập</a>
        </p>
    </div>
</div>
