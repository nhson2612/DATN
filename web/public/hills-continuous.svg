<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
<title id="title">Blue sky and rolling green hills</title>
<desc id="desc">A flat vector landscape with a deep blue upper edge matching #0e699c, a sky fading to pale blue, distant mountains and a winding path through green hills.</desc>
<defs>
  <!-- Exact match with the previous sea-base gradient's final stop. -->
  <linearGradient id="hill-sky" x1="0" y1="0" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#0e699c"/><stop offset=".035" stop-color="#0e699c"/>
    <stop offset=".22" stop-color="#2685b4"/><stop offset=".43" stop-color="#55acd0"/>
    <stop offset=".65" stop-color="#a6d8e7"/><stop offset="1" stop-color="#d3e9df"/>
  </linearGradient>
  <linearGradient id="hill-cloud" x2="0" y2="1"><stop stop-color="#e3f5fb"/><stop offset="1" stop-color="#b7e2f0"/></linearGradient>
  <linearGradient id="hill-back" x2="0" y2="1"><stop stop-color="#69b6cf"/><stop offset="1" stop-color="#419eb9"/></linearGradient>
  <linearGradient id="hill-middle" x2="0" y2="1"><stop stop-color="#94be62"/><stop offset="1" stop-color="#66a45f"/></linearGradient>
  <linearGradient id="hill-front" x2=".2" y2="1"><stop stop-color="#80b360"/><stop offset="1" stop-color="#3a8862"/></linearGradient>
  <linearGradient id="hill-right" x2=".25" y2="1"><stop stop-color="#9bc465"/><stop offset="1" stop-color="#438e62"/></linearGradient>
  <linearGradient id="hill-road" x2="0" y2="1"><stop stop-color="#c6cf87"/><stop offset="1" stop-color="#eed394"/></linearGradient>
  <clipPath id="hill-frame"><path d="M0 0H1600V1000H0Z"/></clipPath>
  <g id="hill-tree"><path d="M0 0C-12 -20 -10 -65 -2 -91Q3 -105 8 -89C19 -48 20 -17 12 0Z" fill="#2d826e"/></g>
  <g id="hill-shrubs" fill="#328777"><path d="M0 20Q3 -7 24 0Q34 -22 58 -10Q76 -38 98 -16Q119 -29 131 -6Q153 -13 164 9Q185 -5 197 20Z"/></g>
</defs>
<g clip-path="url(#hill-frame)">
